[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "attachment-cleaner"
version = "0.1.0"
description = "Free up disk space by removing Messages attachments already in Photos"
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
]

[project.scripts]
attachment-cleaner = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["attachment_cleaner"]
